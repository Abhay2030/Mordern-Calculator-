<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Modern calculator">
    <header class="calculator__header">
      <div class="brand">
        <span class="brand__name">Modern Calculator</span>
        <span class="brand__tag">Fast, precise, smart</span>
      </div>
      <div class="status-bar">
        <span id="memory-indicator" class="memory-indicator" aria-live="polite"></span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <section class="display-panel">
      <div id="history" class="history" aria-live="polite">History will appear here</div>
      <input id="display" class="display__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Calculator display" readonly />
    </section>

    <div class="buttons">
      <button class="btn secondary" data-action="memory-clear">MC</button>
      <button class="btn secondary" data-action="memory-recall">MR</button>
      <button class="btn secondary" data-action="memory-add">M+</button>
      <button class="btn secondary" data-action="memory-subtract">M-</button>
      <button class="btn secondary" data-action="delete">DEL</button>

      <button class="btn function" data-action="sqrt">√</button>
      <button class="btn function" data-action="power2">x²</button>
      <button class="btn function" data-action="percent">%</button>
      <button class="btn function" data-action="parenthesis-left">(</button>
      <button class="btn function" data-action="parenthesis-right">)</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn operator" data-value="/">÷</button>
      <button class="btn operator" data-value="*">×</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn operator" data-value="-">−</button>
      <button class="btn operator" data-value="+">+</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn function" data-action="toggle-sign">±</button>
      <button class="btn function" data-value=".">.</button>

      <button class="btn zero" data-value="0">0</button>
      <button class="btn equals" data-action="calculate">=</button>
      <button class="btn clear" data-action="clear">AC</button>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
